services:
  test-service:
    image: cassandra:latest
    container_name: cassandra-test
    hostname: cassandra
    ports:
      - "9042:9042"  # CQL native transport
    environment:
      - CASSANDRA_CLUSTER_NAME=adbc-test-cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - cassandra-network

volumes:
  cassandra-data:

networks:
  cassandra-network:
    driver: bridge
